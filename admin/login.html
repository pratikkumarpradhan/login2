<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ProjectKart</title>
    <meta
        name="description"
        content="ProjectKart administrator login."
    >

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/animations.css">

    <link rel="stylesheet" href="../css/admin/admin-base.css">
    <link rel="stylesheet" href="../css/admin/admin-forms.css">
    <link rel="stylesheet" href="../css/admin/admin-responsive.css">
</head>

<body class="admin-login-body">

    <!-- =========================================================
         ADMIN LOGIN
    ========================================================== -->
    <main class="admin-login-page">

        <div class="admin-login-background">

            <div class="admin-login-glow admin-login-glow-one"></div>
            <div class="admin-login-glow admin-login-glow-two"></div>

        </div>


        <section class="admin-login-container">

            <!-- =================================================
                 BRAND
            ================================================== -->
            <div class="admin-login-brand">

                <a
                    href="../index.html"
                    class="admin-brand"
                    aria-label="ProjectKart"
                >

                    <span class="admin-brand-mark">
                        PK
                    </span>

                    <span class="admin-brand-text">
                        <strong>ProjectKart</strong>
                        <small>Admin Panel</small>
                    </span>

                </a>

            </div>


            <!-- =================================================
                 LOGIN CARD
            ================================================== -->
            <div class="admin-login-card">

                <div class="admin-login-card-header">

                    <div class="admin-login-icon">
                        <span>⌁</span>
                    </div>

                    <span class="admin-eyebrow">
                        ADMINISTRATION
                    </span>

                    <h1>
                        Welcome back
                    </h1>

                    <p>
                        Sign in to manage your ProjectKart store.
                    </p>

                </div>


                <!-- =================================================
                     LOGIN FORM
                ================================================== -->
                <form
                    class="admin-login-form"
                    data-admin-login-form
                    novalidate
                >

                    <!-- Email -->
                    <div class="admin-form-group">

                        <label for="admin-email">
                            Admin email
                        </label>

                        <div class="admin-input-wrapper">

                            <span class="admin-input-icon">
                                @
                            </span>

                            <input
                                type="email"
                                id="admin-email"
                                name="email"
                                placeholder="admin@example.com"
                                autocomplete="email"
                                data-admin-login-email
                                required
                            >

                        </div>

                    </div>


                    <!-- Password -->
                    <div class="admin-form-group">

                        <div class="admin-form-label-row">

                            <label for="admin-password">
                                Password
                            </label>

                            <button
                                type="button"
                                class="admin-password-toggle"
                                data-admin-password-toggle
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>


                        <div class="admin-input-wrapper">

                            <span class="admin-input-icon">
                                •
                            </span>

                            <input
                                type="password"
                                id="admin-password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                data-admin-login-password
                                required
                            >

                        </div>

                    </div>


                    <!-- Remember -->
                    <div class="admin-login-options">

                        <label class="admin-checkbox-label">

                            <input
                                type="checkbox"
                                name="remember"
                                data-admin-login-remember
                            >

                            <span class="admin-checkbox"></span>

                            <span>
                                Keep me signed in
                            </span>

                        </label>

                    </div>


                    <!-- Status -->
                    <div
                        class="admin-form-status"
                        data-admin-login-status
                        aria-live="polite"
                    ></div>


                    <!-- Submit -->
                    <button
                        type="submit"
                        class="admin-button admin-button-primary admin-button-full admin-login-submit"
                        data-admin-login-submit
                    >

                        <span data-admin-login-submit-text>
                            Sign in to dashboard
                        </span>

                        <span
                            class="admin-button-spinner"
                            data-admin-login-spinner
                            hidden
                        ></span>

                    </button>

                </form>


                <!-- Security note -->
                <div class="admin-login-security">

                    <span class="admin-security-icon">
                        ✓
                    </span>

                    <div>

                        <strong>
                            Secure administrator access
                        </strong>

                        <p>
                            Only authorized ProjectKart administrators
                            can access this dashboard.
                        </p>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 FOOTER LINKS
            ================================================== -->
            <div class="admin-login-footer">

                <a href="../index.html">
                    ← Back to ProjectKart
                </a>

                <span>
                    © <span data-current-year></span>
                    ProjectKart
                </span>

            </div>

        </section>

    </main>


    <!-- =========================================================
         SCRIPTS
    ========================================================== -->
    <script type="module" src="../js/admin/admin-auth.js"></script>
    <script type="module" src="../js/admin/admin-ui.js"></script>

    <script>
        const yearElement =
            document.querySelector("[data-current-year]");

        if (yearElement) {
            yearElement.textContent =
                new Date().getFullYear();
        }
    </script>

</body>
</html>
